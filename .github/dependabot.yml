version: 2
updates:
  - package-ecosystem: "npm" # Dependabot pakai kata "npm" untuk mendeteksi package.json/pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10

    # (Opsional) Kalo kamu gak mau update library tertentu, bisa di-ignore
    # ignore:
    #   - dependency-name: "typescript"